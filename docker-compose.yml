services:
  api:
    build: .
    image: legalintel:0.1.0
    ports:
      - "8000:8000"
    environment:
      # Default to the offline mock provider so `docker compose up` works with
      # zero AWS credentials. Flip to bedrock and pass creds for a live run.
      - LEGALINTEL_LLM_PROVIDER=${LEGALINTEL_LLM_PROVIDER:-mock}
      - LEGALINTEL_EMBEDDER=${LEGALINTEL_EMBEDDER:-hashing}
      - LEGALINTEL_LOG_FORMAT=json
      - LEGALINTEL_AWS_REGION=${LEGALINTEL_AWS_REGION:-us-east-1}
      - LEGALINTEL_BEDROCK_MODEL_ID=${LEGALINTEL_BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      # AWS creds pass through from the host ONLY when set (name-only form). This
      # avoids injecting an empty AWS_SESSION_TOKEN, which can break static-key auth.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
