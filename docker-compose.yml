services:
  api:
    build: .
    image: legalintel:0.1.0
    ports:
      - "8000:8000"
    environment:
      # Default to the offline mock provider so `docker compose up` works with
      # zero AWS credentials. Flip to bedrock and pass creds for a live run.
      LEGALINTEL_LLM_PROVIDER: ${LEGALINTEL_LLM_PROVIDER:-mock}
      LEGALINTEL_EMBEDDER: ${LEGALINTEL_EMBEDDER:-hashing}
      LEGALINTEL_LOG_FORMAT: json
      LEGALINTEL_AWS_REGION: ${LEGALINTEL_AWS_REGION:-ap-south-1}
      LEGALINTEL_BEDROCK_MODEL_ID: ${LEGALINTEL_BEDROCK_MODEL_ID:-anthropic.claude-opus-4-8}
      # Provided only when running against Bedrock; ignored by the mock provider.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
