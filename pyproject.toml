[project]
name = "legalintel"
version = "0.1.0"
description = "Agentic Legal Intelligence Platform: an intent-agnostic multi-agent flow (planner -> retrieval -> drafting -> citation-verification) where every legal claim is grounded in and cited to retrieved public authority."
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.53,<2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "numpy>=1.26",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[bedrock-runtime,s3,ssm]>=1.34",
]
infra = [
    "aws-cdk-lib>=2.140",
    "constructs>=10.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "llm: requires working AWS Bedrock credentials (skipped in CI)",
    "integration: requires external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# `str, Enum` is a deliberate choice for JSON-serialisable enums on pydantic
# models (kept for 3.10 semantics parity); we do not want the StrEnum rewrite.
ignore = ["UP042"]

[tool.mypy]
# Type-check at 3.12 (newer stdlib/numpy stubs) even though the runtime floor is
# 3.11; nothing in src uses 3.12-only syntax.
python_version = "3.12"
strict = true
packages = ["legalintel"]
ignore_missing_imports = true
